[package]
name = "client-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
rand = { version = "0.10.0", features = ["std", "alloc"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
sha2 = "0.10.9"
shared = { version = "0.1.0", path = "../shared" }
wasm-bindgen = "0.2.114"
[lib]
crate-type = ["cdylib", "rlib"]
